<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Downloads</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Main Browser Colors */
            --bg-base: #202225;
            --bg-header: #2f3136;
            /* Slightly lighter for header */
            --bg-hover: rgba(255, 255, 255, 0.04);
            --accent: #14aab8;
            --accent-hover: #118e9a;
            --text-primary: #ffffff;
            --text-secondary: #b9bbbe;
            --text-tertiary: #72767d;
            --border-color: rgba(255, 255, 255, 0.06);
            --font-main: 'Fredoka', sans-serif;

            /* Reduced Radius */
            --radius: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: var(--font-main);
        }

        .container {
            width: 100%;
            height: 100%;
            background-color: var(--bg-base);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        /* Header redesign */
        #header {
            padding: 12px 16px;
            background-color: var(--bg-header);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        #header-title {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #clear-btn {
            font-size: 12px;
            color: var(--accent);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        #clear-btn:hover {
            background: rgba(20, 170, 184, 0.1);
            text-decoration: none;
        }

        #list {
            flex: 1;
            overflow-y: auto;
            padding: 0;
        }

        #list:empty::after {
            content: 'İndirilen dosya yok';
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: var(--text-tertiary);
            font-size: 13px;
        }

        #list::-webkit-scrollbar {
            width: 8px;
        }

        #list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        #list::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            transition: background 0.15s;
        }

        .item:hover {
            background-color: var(--bg-hover);
        }

        .item:last-child {
            border-bottom: none;
        }

        /* Simplified Icon */
        .icon {
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            /* Matches modern UI */
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            font-size: 16px;
            flex-shrink: 0;
            color: var(--text-secondary);
        }

        .info {
            flex: 1;
            min-width: 0;
        }

        .name {
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-primary);
        }

        .progress-bg {
            height: 3px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 1.5px;
            overflow: hidden;
            margin-bottom: 4px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--accent);
            transition: width 0.2s linear;
        }

        .meta {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-secondary);
        }

        .action-link {
            color: var(--accent);
            text-decoration: none;
            cursor: pointer;
            font-weight: 500;
        }

        .action-link:hover {
            text-decoration: underline;
        }

        .actions {
            display: flex;
            gap: 4px;
            margin-left: 10px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 6px;
            border-radius: 4px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
        }

        .icon-btn.delete-btn:hover {
            background: rgba(244, 67, 54, 0.1);
            color: #ff4d4d;
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="header">
            <div id="header-title">
                <span>⬇️</span>
                <span>İndirilenler</span>
            </div>
            <span id="clear-btn" onclick="clearAll()">Temizle</span>
        </div>
        <div id="list"></div>
    </div>

    <script>
        const list = document.getElementById('list');

        function clearAll() {
            window.downloadsAPI.requestClearDownloads();
        }

        function requestOpenFile(id) {
            window.downloadsAPI.requestOpenDownload(id);
        }

        function createItemHTML(d) {
            const isCompleted = d.status === 'completed';
            const isFailed = d.status === 'failed' || d.status === 'interrupted' || d.status === 'cancelled';
            const isProgressing = d.status === 'progressing';

            const div = document.createElement('div');
            div.className = 'item';
            div.id = `dl-${d.id}`;

            let progressHtml = `
                <div class="progress-bg">
                    <div class="progress-bar" style="width: ${d.progress || 0}%; ${isFailed ? 'background: #f44336;' : ''}"></div>
                </div>
                <div class="meta">
                    <span class="status">${isCompleted ? 'Tamamlandı' : (isFailed ? 'Başarısız' : (d.status === 'progressing' ? '...' : d.status))}</span>
                    ${isProgressing ? `<span class="speed">${d.speed || ''}</span>` : ''}
                    <span class="size">${formatBytes(d.downloaded)}${d.total ? ' / ' + formatBytes(d.total) : ''}</span>
                </div>
             `;

            if (isCompleted) {
                progressHtml = `
                    <div class="meta" style="margin-top:2px; display:flex; align-items:center;">
                        <span class="action-link" onclick="requestOpenFile('${d.id}')">Dosyayı Aç</span>
                        <span class="size" style="margin-left:auto">${formatBytes(d.total || d.downloaded)}</span>
                    </div>
                 `;
            }

            // Icons
            const iconPause = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>`;
            const iconPlay = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>`;
            const iconX = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
            const iconFolder = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>`;
            const iconTrash = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>`;

            let actionsHtml = '';
            if (isProgressing) {
                if (d.canResume) {
                    actionsHtml += `<button class="icon-btn" onclick="pauseDownload('${d.id}')" title="Duraklat">${iconPause}</button>`;
                }
                actionsHtml += `<button class="icon-btn" onclick="cancelDownload('${d.id}')" title="İptal">${iconX}</button>`;
            } else if (isCompleted) {
                actionsHtml += `<button class="icon-btn" onclick="showInFolder('${d.id}')" title="Klasörde">${iconFolder}</button>`;
                actionsHtml += `<button class="icon-btn delete-btn" onclick="deleteDownload('${d.id}')" title="Sil">${iconTrash}</button>`;
            } else if (isFailed) {
                actionsHtml += `<button class="icon-btn delete-btn" onclick="deleteDownload('${d.id}')" title="Sil">${iconTrash}</button>`;
            }

            div.innerHTML = `
                <div class="icon">📄</div>
                <div class="info">
                    <div class="name" title="${d.filename}">${d.filename || 'Dosya'}</div>
                    ${progressHtml}
                </div>
                <div class="actions">${actionsHtml}</div>
            `;
            return div;
        }

        // ... FormatBytes and Handlers (same as before)
        function formatBytes(bytes) {
            if (!bytes || bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }
        function pauseDownload(id) { window.downloadsAPI.requestPauseDownload(id); }
        function resumeDownload(id) { window.downloadsAPI.requestResumeDownload(id); }
        function cancelDownload(id) { window.downloadsAPI.requestCancelDownload(id); }
        function deleteDownload(id) { window.downloadsAPI.requestDeleteDownload(id); }
        function showInFolder(id) { window.downloadsAPI.requestShowInFolder(id); }

        window.downloadsAPI.onSetDownloads((downloads) => {
            list.innerHTML = '';
            downloads.forEach(d => list.appendChild(createItemHTML(d)));
        });

        window.downloadsAPI.onDownloadStarted((data) => {
            const existing = document.getElementById(`dl-${data.id}`);
            if (!existing) list.prepend(createItemHTML({ ...data, status: 'progressing', progress: 0, downloaded: 0, total: 0 }));
        });

        window.downloadsAPI.onDownloadProgress((data) => {
            const el = document.getElementById(`dl-${data.id}`);
            if (el) {
                const bar = el.querySelector('.progress-bar');
                if (bar) bar.style.width = data.progress + '%';
                const speed = el.querySelector('.speed');
                if (speed) speed.textContent = data.speed;
                const size = el.querySelector('.size');
                if (size) size.textContent = formatBytes(data.downloaded) + (data.total ? ' / ' + formatBytes(data.total) : '');
            }
        });

        window.downloadsAPI.onDownloadCompleted((data) => {
            const el = document.getElementById(`dl-${data.id}`);
            if (el) el.replaceWith(createItemHTML(data));
        });

        window.downloadsAPI.onDownloadFailed(({ id }) => { document.getElementById(`dl-${id}`)?.remove(); list.prepend(createItemHTML({ id, filename: 'Hata', status: 'failed' })); });
        window.downloadsAPI.onDownloadCancelled(({ id }) => document.getElementById(`dl-${id}`)?.remove());
        window.downloadsAPI.onDownloadDeleted(({ id }) => document.getElementById(`dl-${id}`)?.remove());
    </script>
</body>

</html>
