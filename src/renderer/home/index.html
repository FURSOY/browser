<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
    <link rel="icon" href="../../../assets/icon.ico" type="image/x-icon">
    <style>
        :root {
            /* Color Palette */
            --bg-base: #202225;
            --bg-dark: #18191c;
            --accent: #14aab8;
            --accent-glow: rgba(20, 170, 184, 0.4);
            --text-primary: #ffffff;
            --text-secondary: #b9bbbe;
            --font-main: 'Fredoka', sans-serif;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-main);
            overflow: hidden;
        }

        .search-container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            box-sizing: border-box;
            padding: 20px;
        }

        /* Top Section for Logo and Title */
        .brand-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 40px;
            text-align: center;
            transition: all 0.3s ease;
        }

        h1 {
            font-size: clamp(3rem, 10vw, 6rem);
            font-weight: 600;
            margin: 0;
            color: var(--text-primary);
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            letter-spacing: -2px;
            line-height: 1;
            user-select: none;
        }

        /* Logo Animation */
        #app-logo {
            width: clamp(60px, 15vw, 120px);
            height: clamp(60px, 15vw, 120px);
            margin-bottom: 20px;
            filter: drop-shadow(0 0 20px rgba(20, 170, 184, 0.2));
            animation: float 6s ease-in-out infinite;
            user-select: none;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        /* Glassmorphism Search Box */
        #search-form {
            width: 100%;
            max-width: 600px;
            position: relative;
            z-index: 20;
        }

        #search-input {
            width: 100%;
            padding: 16px 24px;
            font-size: 1.2rem;
            font-family: var(--font-main);
            border-radius: 50px;
            border: 2px solid transparent;
            background-color: rgba(0, 0, 0, 0.25);
            color: var(--text-primary);
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
            backdrop-filter: blur(10px);
        }

        #search-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
            font-weight: 300;
        }

        #search-input:hover {
            background-color: rgba(0, 0, 0, 0.35);
            transform: translateY(-2px);
        }

        #search-input:focus {
            background-color: rgba(0, 0, 0, 0.5);
            border-color: var(--accent);
            box-shadow: 0 0 0 5px var(--accent-glow), 0 10px 25px rgba(0, 0, 0, 0.2);
            transform: translateY(-2px);
        }

        /* --- Footer Info --- */
        #version-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.2);
            font-size: 14px;
            font-weight: 400;
            pointer-events: none;
        }

        #download-status-area {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 250px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 9998;
            box-sizing: border-box;
            padding: 0 5px;
            border-radius: 8px;
            background-color: var(--bg-dark);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #download-status-area.active {
            opacity: 1;
            visibility: visible;
        }

        #download-progress-bar {
            height: 100%;
            background-color: var(--accent);
            width: 0%;
            transition: width 0.2s ease-out;
            position: absolute;
            left: 0;
            top: 0;
            border-radius: 8px;
            opacity: 0.3;
        }

        #download-progress-text {
            position: relative;
            color: white;
            font-size: 13px;
            font-weight: bold;
            text-shadow: 0 0 3px rgba(0, 0, 0, 0.5);
        }

        #restart-button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 2;
        }

        #restart-button:hover {
            background-color: #218838;
        }
    </style>
</head>

<body>
    <div class="search-container">
        <div class="brand-section">
            <img src="../../../assets/icon.ico" alt="Logo" id="app-logo">
            <h1>FURSOY</h1>
        </div>

        <form id="search-form">
            <input type="text" id="search-input" placeholder="Search Google..." autofocus>
        </form>

        <div id="version-info">Versiyon: Yükleniyor...</div>

        <div id="download-status-area">
            <div id="download-progress-bar"></div>
            <span id="download-progress-text"></span>
            <button id="restart-button">Güncellemeyi Kur ve Yeniden Başlat</button>
        </div>
    </div>
    <script defer src="./renderer.js"></script>
</body>

</html>
