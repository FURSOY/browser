<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
    <link rel="icon" href="../../../assets/icon.ico" type="image/x-icon">
    <style>
        :root {
            /* Color Palette */
            --bg-base: #202225;
            --bg-dark: #18191c;
            --accent: #14aab8;
            --accent-glow: rgba(20, 170, 184, 0.4);
            --text-primary: #ffffff;
            --text-secondary: #b9bbbe;
            --font-main: 'Fredoka', sans-serif;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-main);
            overflow: hidden;
        }

        .search-container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            box-sizing: border-box;
            padding: 20px;
        }

        /* Top Section for Logo and Title */
        .brand-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 40px;
            text-align: center;
            transition: all 0.3s ease;
        }

        h1 {
            font-size: clamp(3rem, 10vw, 6rem);
            font-weight: 600;
            margin: 0;
            color: var(--text-primary);
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            letter-spacing: -2px;
            line-height: 1;
            user-select: none;
        }

        /* Logo Animation */
        #app-logo {
            width: clamp(60px, 15vw, 120px);
            height: clamp(60px, 15vw, 120px);
            margin-bottom: 20px;
            filter: drop-shadow(0 0 20px rgba(20, 170, 184, 0.2));
            animation: float 6s ease-in-out infinite;
            user-select: none;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        /* Glassmorphism Search Box */
        #search-form {
            width: 100%;
            max-width: 600px;
            position: relative;
            z-index: 20;
        }

        #search-input {
            width: 100%;
            padding: 16px 24px;
            font-size: 1.2rem;
            font-family: var(--font-main);
            border-radius: 50px;
            border: 2px solid transparent;
            background-color: rgba(0, 0, 0, 0.25);
            color: var(--text-primary);
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
            backdrop-filter: blur(10px);
        }

        #search-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
            font-weight: 300;
        }

        #search-input:hover {
            background-color: rgba(0, 0, 0, 0.35);
            transform: translateY(-2px);
        }

        #search-input:focus {
            background-color: rgba(0, 0, 0, 0.5);
            border-color: var(--accent);
            box-shadow: 0 0 0 5px var(--accent-glow), 0 10px 25px rgba(0, 0, 0, 0.2);
            transform: translateY(-2px);
        }

        /* --- Footer Info --- */
        #version-info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.2);
            font-size: 14px;
            font-weight: 400;
            pointer-events: none;
        }

        #download-status-area {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 250px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 9998;
            box-sizing: border-box;
            padding: 0 5px;
            border-radius: 8px;
            background-color: var(--bg-dark);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #download-status-area.active {
            opacity: 1;
            visibility: visible;
        }

        #download-progress-bar {
            height: 100%;
            background-color: var(--accent);
            width: 0%;
            transition: width 0.2s ease-out;
            position: absolute;
            left: 0;
            top: 0;
            border-radius: 8px;
            opacity: 0.3;
        }

        #download-progress-text {
            position: relative;
            color: white;
            font-size: 13px;
            font-weight: bold;
            text-shadow: 0 0 3px rgba(0, 0, 0, 0.5);
        }

        #restart-button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 2;
        }

        #restart-button:hover {
            background-color: #218838;
        }

        /* --- Profile Styles --- */
        #profile-section {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }

        #profile-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            cursor: pointer;
            padding: 0;
            overflow: hidden;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #profile-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 10px rgba(20, 170, 184, 0.3);
        }

        #user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }

        #account-popup {
            position: absolute;
            top: 50px;
            right: 0;
            width: 300px;
            background: var(--bg-dark);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            padding: 20px;
            display: none;
            flex-direction: column;
            align-items: center;
            animation: slideIn 0.2s ease-out;
            backdrop-filter: blur(10px);
        }

        #account-popup.active {
            display: flex;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .popup-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
            text-align: center;
            width: 100%;
        }

        #popup-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-bottom: 15px;
            border: 2px solid var(--accent);
        }

        .user-info {
            width: 100%;
        }

        #user-name {
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--text-primary);
        }

        #user-email {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .popup-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .action-btn {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            cursor: pointer;
            font-family: var(--font-main);
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .action-btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
            font-weight: 600;
        }

        .action-btn.primary:hover {
            background: var(--accent-hover);
            box-shadow: 0 0 15px var(--accent-glow);
        }
    </style>
</head>

<body>
    <div class="search-container">
        <!-- Profile Section -->
        <div id="profile-section">
            <button id="profile-btn" title="Google Hesabı">
                <img id="user-avatar"
                    src="https://www.gstatic.com/images/branding/product/1x/avatar_circle_blue_512dp.png" alt="Profile">
            </button>
            <div id="account-popup">
                <div class="popup-header">
                    <img id="popup-avatar"
                        src="https://www.gstatic.com/images/branding/product/1x/avatar_circle_blue_512dp.png"
                        alt="Avatar">
                    <div class="user-info">
                        <div id="user-name">Oturum Açılmadı</div>
                        <div id="user-email">Google hesabınızla giriş yapın</div>
                    </div>
                </div>
                <div class="popup-actions">
                    <button id="login-google-btn" class="action-btn primary">Oturum Aç</button>
                    <button id="manage-account-btn" class="action-btn">Hesabı Yönet</button>
                    <button id="logout-btn" class="action-btn" style="display: none;">Oturum Kapat</button>
                </div>
            </div>
        </div>

        <div class="brand-section">
            <img src="../../../assets/icon.ico" alt="Logo" id="app-logo">
            <h1>FURSOY</h1>
        </div>

        <form id="search-form">
            <input type="text" id="search-input" placeholder="Search Google..." autofocus>
        </form>

        <div id="version-info">Versiyon: Yükleniyor...</div>

        <div id="download-status-area">
            <div id="download-progress-bar"></div>
            <span id="download-progress-text"></span>
            <button id="restart-button">Güncellemeyi Kur ve Yeniden Başlat</button>
        </div>
    </div>
    <script defer src="./renderer.js"></script>
</body>

</html>
