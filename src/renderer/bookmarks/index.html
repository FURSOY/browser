<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Main Browser Colors */
            --bg-base: #202225;
            --bg-dark: #18191c;
            --accent: #14aab8;
            --accent-hover: #118e9a;
            --text-primary: #ffffff;
            --text-secondary: #dcddde;
            --border-color: rgba(255, 255, 255, 0.06);
            --font-main: 'Fredoka', sans-serif;

            /* Reduced Radius */
            --radius: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            font-family: var(--font-main);
        }

        .container {
            width: 100%;
            height: 100%;
            /* Lighter background to match browser base */
            background-color: var(--bg-base);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .header {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon-star {
            font-size: 20px;
            color: #ffcc00;
        }

        .title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .input-group {
            width: 100%;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: white;
            font-size: 13px;
            outline: none;
            font-family: var(--font-main);
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent);
            background: rgba(0, 0, 0, 0.3);
        }

        .buttons {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: auto;
        }

        button {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            font-family: var(--font-main);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        #save-btn {
            background: var(--accent);
            color: white;
        }

        #save-btn:hover {
            background: var(--accent-hover);
        }

        #remove-btn {
            background: rgba(220, 53, 69, 0.1);
            color: #ff6b6b;
            border: 1px solid rgba(220, 53, 69, 0.2);
        }

        #remove-btn:hover {
            background: rgba(220, 53, 69, 0.2);
        }

        #cancel-btn {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid transparent;
        }

        #cancel-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <span class="icon-star">⭐</span>
            <span class="title" id="popup-title">Favoriye Ekle</span>
        </div>

        <div class="input-group">
            <input type="text" id="bookmark-name" placeholder="Favori adı..." autofocus>
        </div>

        <div class="buttons">
            <button id="remove-btn" style="display: none;">Kaldır</button>
            <button id="cancel-btn">İptal</button>
            <button id="save-btn">Kaydet</button>
        </div>
    </div>

    <script>
        // ... (Same JS Logic)
        const nameInput = document.getElementById('bookmark-name');
        const saveBtn = document.getElementById('save-btn');
        const cancelBtn = document.getElementById('cancel-btn');
        const removeBtn = document.getElementById('remove-btn');
        const titleEl = document.getElementById('popup-title');

        if (window.electronAPI) {
            window.electronAPI.receive('set-bookmark-data', (data) => {
                nameInput.value = data.title || '';
                // Use setTimeout to ensure focus works after rendering
                setTimeout(() => {
                    nameInput.focus();
                    nameInput.select();
                }, 50);
                window.currentUrl = data.url;

                if (data.isFavorite) {
                    titleEl.textContent = 'Favoriyi Düzenle';
                    removeBtn.style.display = 'block';
                    saveBtn.textContent = 'Güncelle';
                } else {
                    titleEl.textContent = 'Favoriye Ekle';
                    removeBtn.style.display = 'none';
                    saveBtn.textContent = 'Kaydet';
                }
            });
        }

        saveBtn.onclick = () => {
            const title = nameInput.value.trim() || window.currentUrl;
            window.bridge.saveBookmark(window.currentUrl, title);
        };

        removeBtn.onclick = () => {
            window.bridge.removeBookmark(window.currentUrl);
        };

        cancelBtn.onclick = () => {
            window.bridge.closePopup();
        };

        nameInput.onkeydown = (e) => {
            if (e.key === 'Enter') saveBtn.onclick();
            if (e.key === 'Escape') cancelBtn.onclick();
        };
    </script>
</body>

</html>
