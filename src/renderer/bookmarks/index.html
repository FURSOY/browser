<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #18191c;
            --bg-darker: #0f1012;
            --accent: #14aab8;
            --accent-hover: #118e9a;
            --accent-light: #1bc4d4;
            --text-primary: #ffffff;
            --text-secondary: #b9bbbe;
            --text-tertiary: #8e9297;
            --border-color: rgba(255, 255, 255, 0.08);
            --border-color-hover: rgba(255, 255, 255, 0.15);
            --font-main: 'Fredoka', sans-serif;
            --radius-s: 6px;
            --radius-m: 10px;
            --shadow-popup: 0 8px 24px rgba(0, 0, 0, 0.4), 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-darker) 100%);
            color: var(--text-primary);
            font-family: var(--font-main);
            padding: 16px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-m);
            box-shadow: var(--shadow-popup);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            gap: 14px;
            height: 100vh;
        }

        .title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .title::before {
            content: '⭐';
            font-size: 16px;
            filter: grayscale(0.3);
        }

        input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.3);
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-s);
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 500;
            outline: none;
            font-family: var(--font-main);
            transition: all 0.2s ease;
        }

        input::placeholder {
            color: var(--text-tertiary);
        }

        input:focus {
            border-color: var(--accent);
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 0 3px rgba(20, 170, 184, 0.1);
        }

        .buttons {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        button {
            padding: 8px 18px;
            border-radius: var(--radius-s);
            border: none;
            font-family: var(--font-main);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: -0.1px;
        }

        #save-btn {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            color: white;
            box-shadow: 0 2px 8px rgba(20, 170, 184, 0.3);
        }

        #save-btn:hover {
            background: linear-gradient(135deg, var(--accent-hover) 0%, var(--accent) 100%);
            box-shadow: 0 4px 12px rgba(20, 170, 184, 0.4);
            transform: translateY(-1px);
        }

        #save-btn:active {
            transform: translateY(0);
        }

        #remove-btn {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            color: white;
            box-shadow: 0 2px 8px rgba(220, 53, 69, 0.3);
        }

        #remove-btn:hover {
            background: linear-gradient(135deg, #c82333 0%, #bd2130 100%);
            box-shadow: 0 4px 12px rgba(220, 53, 69, 0.4);
            transform: translateY(-1px);
        }

        #cancel-btn {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        #cancel-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            border-color: var(--border-color-hover);
        }

        /* Subtle animation on load */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        body {
            animation: slideIn 0.2s ease;
        }
    </style>
</head>

<body>
    <div class="title" id="popup-title">Favoriye Ekle</div>
    <input type="text" id="bookmark-name" placeholder="Başlık girin..." autofocus>
    <div class="buttons">
        <button id="remove-btn" style="display: none;">Kaldır</button>
        <button id="cancel-btn">İptal</button>
        <button id="save-btn">Kaydet</button>
    </div>
    <script>
        const nameInput = document.getElementById('bookmark-name');
        const saveBtn = document.getElementById('save-btn');
        const cancelBtn = document.getElementById('cancel-btn');
        const removeBtn = document.getElementById('remove-btn');
        const titleEl = document.getElementById('popup-title');

        // Listen to IPC from main process
        if (window.electronAPI) {
            window.electronAPI.receive('set-bookmark-data', (data) => {
                nameInput.value = data.title || '';
                nameInput.focus();
                nameInput.select();
                window.currentUrl = data.url;

                if (data.isFavorite) {
                    titleEl.textContent = 'Favoriyi Düzenle';
                    removeBtn.style.display = 'block';
                    saveBtn.textContent = 'Güncelle';
                } else {
                    titleEl.textContent = 'Favoriye Ekle';
                    removeBtn.style.display = 'none';
                    saveBtn.textContent = 'Kaydet';
                }
            });
        }

        saveBtn.onclick = () => {
            const title = nameInput.value.trim() || window.currentUrl;
            window.bridge.saveBookmark(window.currentUrl, title);
        };

        removeBtn.onclick = () => {
            window.bridge.removeBookmark(window.currentUrl);
        };

        cancelBtn.onclick = () => {
            window.bridge.closePopup();
        };

        // Handle Enter key
        nameInput.onkeydown = (e) => {
            if (e.key === 'Enter') saveBtn.onclick();
            if (e.key === 'Escape') cancelBtn.onclick();
        };
    </script>
</body>

</html>
