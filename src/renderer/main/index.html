<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FURSOY Browser Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/main.css">
</head>

<body>
    <!-- Tabs Container -->
    <!-- Tabs Container -->
    <div id="tabs-container">
        <div id="tabs-list"></div>
        <button id="new-tab-btn" title="New Tab">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
            </svg>
        </button>
        <div id="window-controls">
            <button id="min-btn" title="Minimize">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19 13H5v-2h14v2z" />
                </svg>
            </button>
            <button id="max-btn" title="Maximize">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M18 4H6c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 14H6V6h12v12z" />
                </svg>
            </button>
            <button id="close-btn" title="Close">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Tarayıcı Kontrol Çubuğu -->
    <div id="browser-controls">
        <button id="back-btn" title="Back">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
            </svg>
        </button>
        <button id="forward-btn" title="Forward">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z" />
            </svg>
        </button>
        <button id="reload-btn" title="Reload">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path
                    d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" />
            </svg>
        </button>
        <button id="home-btn" title="Home">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
            </svg>
        </button>
        <input type="text" id="address-bar" placeholder="Search Google or type a URL">
        <button id="downloads-btn" title="Downloads">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z" />
            </svg>
        </button>

        <!-- İndirme Popup'ı (Başlangıçta gizli) -->
        <div id="downloads-popup">
            <div id="downloads-header">
                <span>İndirilenler</span>
                <span id="downloads-clear">Temizle</span>
            </div>
            <div id="downloads-list">
                <!-- İndirme öğeleri buraya dinamik olarak eklenecek -->
                <!-- Örnek Öğe:
                <div class="download-item">
                    <div class="download-icon">📄</div>
                    <div class="download-info">
                        <div class="download-name">dosya_adı.zip</div>
                        <div class="download-progress-bar"><div class="progress" style="width: 50%"></div></div>
                        <div class="download-meta">5.2MB / 10MB - 1.2MB/s</div>
                    </div>
                </div>
                -->
            </div>
        </div>
        <div id="loading-bar"></div>
    </div>

    <!-- BrowserView'in yerleştirileceği boş yer tutucu -->
    <div id="webview-container-placeholder">
        <!-- Electron's BrowserView will occupy this space -->
    </div>

    <script defer src="./renderer.js"></script>
</body>

</html>
