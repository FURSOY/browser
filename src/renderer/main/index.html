<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FURSOY Browser Manager</title>
    <link rel="stylesheet" href="../styles/main.css">
</head>

<body>
    <!-- Tabs Container -->
    <div id="tabs-container">
        <div id="tabs-list"></div>
        <button id="new-tab-btn">+</button>
        <div id="window-controls">
            <button id="min-btn" title="Minimize">─</button>
            <button id="max-btn" title="Maximize">▢</button>
            <button id="close-btn" title="Close">✕</button>
        </div>
    </div>

    <!-- Tarayıcı Kontrol Çubuğu -->
    <div id="browser-controls">
        <button id="back-btn">◀</button>
        <button id="forward-btn">▶</button>
        <button id="reload-btn">↻</button>
        <button id="home-btn">🏠</button>
        <input type="text" id="address-bar" placeholder="Search Google or type a URL">
    </div>

    <!-- BrowserView'in yerleştirileceği boş yer tutucu -->
    <div id="webview-container-placeholder">
        <!-- Electron's BrowserView will occupy this space -->
    </div>

    <script defer src="./renderer.js"></script>
</body>

</html>
